<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 포스터 팔레트: 매리골드 앰버 바탕 + 검정 활자 -->
  <rect width="64" height="64" fill="#eeb437"/>
  <!-- 하프톤 도트 스크린 (아래로 갈수록 빽빽) -->
  <g fill="#121110" opacity="0.16">
    <circle cx="8" cy="52" r="1.6"/><circle cx="20" cy="52" r="1.6"/><circle cx="32" cy="52" r="1.6"/>
    <circle cx="44" cy="52" r="1.6"/><circle cx="56" cy="52" r="1.6"/>
    <circle cx="14" cy="44" r="1.3"/><circle cx="26" cy="44" r="1.3"/><circle cx="38" cy="44" r="1.3"/>
    <circle cx="50" cy="44" r="1.3"/>
    <circle cx="8" cy="36" r="1"/><circle cx="20" cy="36" r="1"/><circle cx="32" cy="36" r="1"/>
    <circle cx="44" cy="36" r="1"/><circle cx="56" cy="36" r="1"/>
  </g>
  <!-- 40 — 포스터의 굵은 그로테스크 -->
  <text x="32" y="41" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30"
        font-weight="800" letter-spacing="-1" fill="#121110" text-anchor="middle">40</text>
</svg>
